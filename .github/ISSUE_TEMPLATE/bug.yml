name: Bug Report
description: Report something that is broken or behaving incorrectly
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for maintainers to reproduce the issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Describe the bug clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: List the exact steps needed to reproduce the problem.
      placeholder: |
        1. Open ...
        2. Connect to ...
        3. Click ...
        4. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: data-source
    attributes:
      label: Data Source
      description: Which data source is affected?
      options:
        - PostgreSQL
        - SQLite
        - Redis
        - OpenSearch
        - Apache Kafka
        - RabbitMQ
        - Multiple
        - Not applicable
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version Or Commit
      placeholder: v0.0.0 or commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Bun version, Docker usage, and relevant database versions.
      placeholder: |
        OS:
        Bun:
        Docker:
        Database/service version:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs Or Screenshots
      description: Paste relevant logs, stack traces, screenshots, or recordings.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-Submission Checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets, credentials, and private data from this report.
          required: true
