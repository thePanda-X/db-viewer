name: Feature Request
description: Suggest an improvement or new capability
title: '[Feature]: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please explain the user problem before proposing an implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
      placeholder: I want to... but currently...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches or workarounds have you considered?
  - type: dropdown
    id: data-source
    attributes:
      label: Related Data Source
      options:
        - PostgreSQL
        - SQLite
        - Redis
        - OpenSearch
        - Apache Kafka
        - RabbitMQ
        - Multiple
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add screenshots, examples, links, or implementation notes.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-Submission Checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This request describes a user-facing problem or workflow.
          required: true
